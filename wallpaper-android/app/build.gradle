plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jindouguan.wallpaperprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jindouguan.wallpaperprobe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1-probe'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
